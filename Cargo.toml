[workspace]
members = ["crates/auction-core", "programs/bouncer"]
resolver = "2"

# Toolchain pin for the reproducible build: solana-verify reads this to pick the image
# solanafoundation/solana-verifiable-build:4.3.0 (cargo-build-sbf 4.3.0, platform-tools v1.57).
[workspace.metadata.cli]
solana = "4.3.0"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
